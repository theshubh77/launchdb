name: Update Directory Counts

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-counts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Update Script
        id: update_script
        run: node scripts/update-counts.js

      - name: Update GitHub Repo Description
        if: ${{ steps.update_script.outputs.description != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT_REPO || secrets.GITHUB_TOKEN }}
          REPO_DESCRIPTION: ${{ steps.update_script.outputs.description }}
        run: |
          echo "Updating repository description to: $REPO_DESCRIPTION"
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }} \
            -f description="$REPO_DESCRIPTION"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md public/launchdb-fallback.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update directory count and fallback list [skip ci]"
            git push
            echo "Changes pushed successfully."
          else
            echo "No changes in files to commit."
          fi
